<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Keigo: Business Japanese</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Hanken+Grotesk:wght@400;500;600;700&family=Noto+Serif+JP:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=Zen+Old+Mincho:wght@400;500;600;700;900&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #131217;
    --bg-2: #17161d;
    --raised: #1f1e27;
    --raised-2: #26242f;
    --line: rgba(240, 237, 230, 0.09);
    --line-strong: rgba(240, 237, 230, 0.16);
    --ink: #efece4;
    --ink-2: #b6b1a7;
    --ink-3: #807b72;
    --accent: #e8a13a;
    --accent-ink: #16140f;
    --radius: 18px;
    --font-en: 'Spectral', Georgia, serif;
    --font-jp: 'Noto Serif JP', serif;
    --font-ui: 'Hanken Grotesk', system-ui, sans-serif;
    --density-pad: 26px;
    --density-gap: 16px;
    --content-scale: 1;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background:
      radial-gradient(120% 80% at 50% -10%, #1c1a23 0%, #100f14 60%, #0c0b0f 100%);
    min-height: 100vh;
    font-family: var(--font-ui);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* Device centering / scaling */
  #stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  #scaler { transform-origin: center center; }

  /* Japanese rendering */
  ruby { ruby-align: center; }
  rt {
    font-family: var(--font-jp);
    font-weight: 500;
    color: var(--ink-3);
    font-size: 0.46em;
    letter-spacing: 0.02em;
    transition: opacity 0.25s ease;
    user-select: none;
  }
  .furi-off rt { opacity: 0; font-size: 0.001em; }
  .jp { font-family: var(--font-jp); font-feature-settings: "palt" 1; font-style: normal; }

  .romaji { transition: opacity 0.2s ease, max-height 0.25s ease; }
  .romaji-off .romaji { display: none; }

  /* Scrollbars hidden for app feel */
  .noscroll::-webkit-scrollbar { width: 0; height: 0; }
  .noscroll { scrollbar-width: none; -ms-overflow-style: none; }

  ::selection { background: var(--accent); color: var(--accent-ink); }

  .feed-snap { scroll-snap-type: y mandatory; }
  .feed-snap > * { scroll-snap-align: start; scroll-snap-stop: always; }

  @keyframes riseIn {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>
<body>
  <template id="__bundler_thumbnail">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <rect width="100" height="100" fill="#131217"/>
      <text x="50" y="60" font-family="serif" font-size="34" fill="#e8a13a" text-anchor="middle">敬</text>
    </svg>
  </template>
  <div id="stage"><div id="scaler"><div id="root"></div></div></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="content.js"></script>
  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="jp.jsx"></script>
  <script type="text/babel" src="cards.jsx"></script>
  <script type="text/babel" src="screens.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
